<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评级标识 · 按钮纹理预览</title>
<link rel="stylesheet" href="features/cg_rating.preview.css?v=20261015h"><style>
*{box-sizing:border-box}body{margin:0;color:#213c55;background:#edf7fc;font:14px/1.5 "Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px 34px}h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#6a849b;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.sample-button{border:0;border-radius:13px;padding:13px 28px;color:white;font:800 15px "Microsoft YaHei",sans-serif;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);background:linear-gradient(135deg,#ffffff47,transparent 38%),repeating-linear-gradient(135deg,transparent 0 9px,#ffffff42 9px 10px,transparent 10px 18px),conic-gradient(from 45deg at 18% 50%,#ffffff2e 0 25%,transparent 0 100%),conic-gradient(from 225deg at 84% 52%,#ffffff29 0 25%,transparent 0 100%),linear-gradient(135deg,#6fc3ff,#248bc2)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:21px}.cell{--from:#ffdb78;--to:#e7a52c;--ink:#94651c}.cell[data-grade=excellent]{--from:#d4b2ff;--to:#9a6bd7;--ink:#705096}.cell[data-grade=pass]{--from:#88d9f7;--to:#36a8ce;--ink:#267a9b}.cell[data-grade=fail]{--from:#e9afb9;--to:#b87891;--ink:#92566d}.mark{position:relative;width:118px;margin:auto;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transform:skewX(-7deg);pointer-events:none}.glyph{display:grid;grid-template-areas:"letter";font:900 120px/.98 "Arial Black","Arial",sans-serif;letter-spacing:-4px;padding-right:5px;overflow:visible}.glyph::before,.glyph::after{content:attr(data-letter);grid-area:letter;display:block;white-space:pre}.glyph::before{color:#fff;-webkit-text-stroke:5px #fff;paint-order:stroke fill;filter:drop-shadow(0 2px 0 #bfd4df)}.glyph::after{color:transparent;background:linear-gradient(135deg,#ffffff47,transparent 38%),repeating-linear-gradient(135deg,transparent 0 9px,#ffffff42 9px 10px,transparent 10px 18px),conic-gradient(from 45deg at 18% 50%,#ffffff2e 0 25%,transparent 0 100%),conic-gradient(from 225deg at 84% 52%,#ffffff29 0 25%,transparent 0 100%),linear-gradient(135deg,var(--from),var(--to));background-clip:text;-webkit-background-clip:text;-webkit-text-stroke:1.4px var(--ink);paint-order:stroke fill}.label{font-size:12px;letter-spacing:1px;font-weight:800;color:var(--ink);text-shadow:-1px 0 white,1px 0 white,0 -1px white,0 1px white;transform:skewX(7deg);white-space:nowrap}.swatch{height:196px;border-bottom:1px solid #c9e0ed;display:flex;align-items:center;justify-content:center;padding-bottom:16px}.cell>h2{text-align:center;font-size:13px;font-weight:600;color:#658198;margin:16px 0 18px;letter-spacing:.08em}.photo{position:relative;transform:rotate(-2deg);margin:18px 0 0;padding:7px;background:linear-gradient(135deg,#e2f6ffba,#accfe978);border:1px solid #f9fdffcf;border-radius:5px;box-shadow:0 8px 18px #265b7520;backdrop-filter:blur(14px)}.photo>img{display:block;width:100%;height:auto;border-radius:2px}.photo .mark{position:absolute;left:-9px;top:-18px;width:68px;transform:skewX(-7deg)}.photo .glyph{font-size:65px;letter-spacing:-2px;padding-right:3px}.photo .glyph::before{-webkit-text-stroke:3px white}.photo .glyph::after{-webkit-text-stroke:1px var(--ink)}.photo .label{font-size:9px;letter-spacing:0}.photo figcaption{text-align:center;padding:9px 0 3px;font-size:11px;font-weight:700;color:#496f88}.footnote{text-align:center;font-size:12px;color:#6a849b;margin:32px 0 0}.legend{font-size:11px;letter-spacing:.12em;color:#8a9daa;margin-bottom:7px}.sample-wrap{text-align:right}.sample-wrap small{display:block;font-size:10px;color:#8296a6;margin-top:4px}@media(max-width:700px){main{padding:22px 18px}header{display:block}.sample-wrap{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}h1{font-size:20px}.swatch{height:160px}.glyph{font-size:106px}.footnote{margin-top:26px}}
.embodied-original-reward .cg-theatre .swatch .embodied-cg-grade strong{font-size:112px}.embodied-original-reward .cg-theatre .photo .embodied-cg-grade strong{font-size:62px}.swatch .cg-grade-star{scale:1.5}.embodied-original-reward .cg-theatre .swatch .embodied-cg-grade{transform:none}.embodied-original-reward .cg-theatre .photo .embodied-cg-grade{transform:rotate(-3deg)}
</style></head><body><main><header><div><div class="legend">RANK DESIGN · 03</div><h1>评级标识 · 按钮同款纹理</h1><p>S：柔光＋三颗星芒 / A：单颗星芒 / B、F：简洁字形</p></div><div class="sample-wrap"><button class="sample-button">下一步 ➜</button><small>游戏主按钮纹理对照</small></div></header><div class="grid embodied-original-reward" id="ranks"></div><p class="footnote">上方为放大检查，下方为照片左上角的实际应用比例 · 与游戏共用评级样式</p></main><script>
const grades=[['top','S','顶尖评审','金色','review_a1_live.webp'],['excellent','A','优秀评审','紫色','review_a1_news.webp'],['pass','B','合格评审','蓝绿','review_v5_pass.webp'],['fail','F','评审未达标','红灰','review_v5_fail.webp']];
const mark=(letter,label,grade)=>'<div class="mark embodied-cg-grade cg-rating-label" data-cg-grade="'+grade+'" aria-label="'+letter+' · '+label+'"><span class="cg-grade-face"><strong data-letter="'+letter+'"><span>'+letter+'</span></strong><small>'+label+'</small><i class="cg-grade-star cg-grade-star-1" aria-hidden="true"></i><i class="cg-grade-star cg-grade-star-2" aria-hidden="true"></i><i class="cg-grade-star cg-grade-star-3" aria-hidden="true"></i></span></div>';
document.getElementById('ranks').innerHTML=grades.map(([grade,letter,label,color,file])=>'<section class="cell cg-theatre" data-grade="'+grade+'"><div class="swatch">'+mark(letter,label,grade)+'</div><h2>'+letter+' / '+color+'</h2><figure class="photo"><img src="/resource/story/'+file+'" alt="CG预览">'+mark(letter,label,grade)+'<figcaption>'+label+'</figcaption></figure></section>').join('');
</script></body></html>
