.load-bar{height:.7rem;border-radius:999px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(40,90,130,.18);overflow:hidden;padding:2px}

<body>
  <canvas id="game"></canvas>

  <!-- ====== 主场景右下角「开始训练」入口 ====== -->
  <button id="btn-train" class="btn-train" hidden>开始训练</button>

  <!-- ====== 玩法界面（二次元可爱风） ====== -->
  <div id="training" class="training" hidden>
    <!-- 右上角：关闭 / 说明 / 菜单（默认隐藏，招募阶段由玩法 HUD 动态渲染同名按钮接管） -->
    <div class="train-topbar" hidden>
      <button id="train-help" class="train-btn" type="button">说明</button>
      <button id="train-menu" class="train-btn" type="button">菜单</button>
      <button id="train-close" class="train-btn train-btn-close" type="button">✕</button>
    </div>

    <!-- 主体内容（占位，后续养成系统在此扩展） -->
    <div id="train-body" class="train-body">
      <div class="train-card">
        <div class="train-card-title">今日训练</div>
        <p class="train-card-text">这里是玩法操作界面主体占位区域。<br>后续会放：训练目标 / 属性面板 / 养成互动等。</p>
      </div>
    </div>

    <!-- 大模型研发养成玩法（最小可玩闭环） -->
    <div id="devgame" class="devgame" hidden>
      <div id="devgame-render" class="devgame-render"></div>
    </div>

    <!-- 二级弹窗：玩法说明 -->
    <div id="train-help-pop" class="train-pop" hidden>
      <div class="pop-card">
        <div class="pop-title">玩法说明</div>
        <div class="pop-body">
          点击地面控制小鲸鱼蹦蹦跳跳移动。<br>
          点击主场景右下角「开始训练」进入本玩法界面。<br>
          · 说明：了解玩法规则<br>
          · 菜单：调整音乐 / 音效音量<br>
          更多养成玩法正在开发中，敬请期待～
        </div>
        <button class="pop-btn" data-close="train-help-pop" type="button">知道了</button>
      </div>
    </div>

    <!-- 二级弹窗：菜单（音量 + 重新开始） -->
    <div id="train-menu-pop" class="train-pop" hidden>
      <div class="pop-card">
        <div class="pop-title">菜单</div>
        <div class="pop-sec-title">音量</div>
        <div class="pop-row">
          <span class="pop-label">🎵 音乐</span>
          <input id="vol-music" class="pop-range" type="range" min="0" max="1" step="0.05" value="0.6">
        </div>
        <div class="pop-row">
          <span class="pop-label">🔊 音效</span>
          <input id="vol-sfx" class="pop-range" type="range" min="0" max="1" step="0.05" value="0.9">
        </div>
        <div class="pop-divider"></div>
        <div class="pop-sec-title">训练</div>
        <button id="train-restart" class="pop-btn pop-btn-danger" type="button">🔄 重新开始游戏</button>
        <p class="pop-tip">重新开始将清空当前训练进度（含自动存档），不可恢复。</p>
        <button class="pop-btn" data-close="train-menu-pop" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- ====== 强制加载界面 ====== -->
  <div id="loading" class="screen loading">
    <div class="load-inner">
      <div class="load-bar"><div id="load-fill" class="load-fill"></div></div>
      <div id="load-text" class="load-text">加载中…</div>
      <!-- 启动黑匣显示区（2026-09-24）：诊断文案只写这里，绝不碰 load-text
           （load-text 归加载进度/「点击开始」所有，覆盖会吃掉操作指引）。

    </div>
  </div>

  <script>
  /* 启动黑匣（2026-09-24）——故意写成 ES5 内联，不依赖任何外部 js：
     旧探针有个致命前提：menu.js 得能被下载且能解析（错误探针/逃生通道都在它身上），
     且旧内联 error 监听没挂 capture，<script>/<img> 下载失败根本收不到。

     ① 错误探针（capture）：JS 异常 / script·img·css 下载失败 / Promise 拒绝 → 写上 #load-diag；

        引导去「B站内打开」或 Safari / 直链），之后触控恢复自动还原「点击开始」；

     ⚠️ 诊断必须"时间驱动 + 实时更新"：输入被外层吃掉时，任何"点一下才触发"的
        诊断永远等不到触发（24c 的教训——快照式倾倒分不清"没点"还是"没送到"）。 */
  (function () {
    var _gone = false;
    var BUILD = "20261019c";
    var t0 = new Date().getTime();
    var LOG = [];
    function now() { return "+" + ((new Date().getTime() - t0) / 1000).toFixed(1) + "s"; }
    function mark(m) { LOG.push(now() + " " + m); if (LOG.length > 60) LOG.shift(); }
    window.__B = { t0: t0, mark: mark, log: LOG };

    function dead() { var el = document.getElementById("loading"); return !el || el.hidden; }
    function tail(n) { return LOG.slice(-n).join("\n"); }

    /* 环境行：系统版本 / 微信 / QQ / 是否 iframe / 视口 / build —— 截图自带现场。
       iOS 26+ 起 Safari 系 UA 冻结在 18.x（Apple Release Notes 156170132），
       所以「iOS 18.7」实际可能是 26/27，标注出来免得再被 UA 版本带偏。 */

      var app = /MicroMessenger/i.test(ua) ? " 微信" : (/MQQBrowser|QQ\//i.test(ua) ? " QQ" : "");
      var iframe = false;
      try { iframe = (window.top !== window.self); } catch (e) { iframe = true; }
      /* 2026-10-02：URL 带 wk_esc=N = 上一次的逃生锚点导航又回到了本页 ——
         截图里出现 esc-back#N 即实锤「跳出去又被套回外壳」，不必再猜。 */

        (window.innerWidth || 0) + "x" + (window.innerHeight || 0) +
        " build " + BUILD;
    }

    /* 诊断统一渲染口：错误行(若有) + 环境行 + 时间线 + 触控计数（实时）。
       ⚠️ 只写专用文本子节点 diagText 的 textContent —— 24e 教训（玩家实测抓到）：
       直接写容器 textContent 会把注入的逃生锚点**连根抹掉**（按钮出现 4 秒后
       被周期刷新吃掉，玩家根本来不及点）。文本走子节点，锚点永不被动。 */
    /* iOS 判定（2026-10-03）：安卓不再显示调试信息（用户要求），只有 iOS 才铺
       环境行/时间线/触控计数；iPadOS 13+ 桌面 UA 也算（MacIntel + 多点触控）。
       ⚠️ menu.js 里有一份同款判定（管 iOS 自动进入）—— 两处改要同改。 */

      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    var inputs = 0, lastErr = "", diagText = null;
    function renderDiag() {
      if (_gone) return;
      /* 2026-10-03（用户要求）：安卓不显示调试信息 —— 只在真错误（资源/JS 失败）时
         提示一句，不铺环境行/时间线/触控计数；iOS 保留全量诊断（本轮问题现场）。 */
      if (!IS_IOS && !lastErr) return;
      var box = document.getElementById("load-diag");
      if (!box) return;
      if (!diagText || diagText.parentNode !== box) {
        diagText = document.createElement("div");
        if (box.firstChild) box.insertBefore(diagText, box.firstChild);
        else box.appendChild(diagText);

      diagText.textContent = (lastErr ? lastErr + "\n" : "") +
        (IS_IOS
          ? "诊断 " + envLine() + "\n" + tail(10) +
            "\n触控: " + inputs + " 次" +

    /* ② 输入探针：计数 + 立即刷新诊断（每次点按屏幕上的计数都会动——

        guided = false;

    setInterval(function () {
      if (dead()) { _gone = true; return; }
      renderDiag();
    }, 4000);

    /* ④ 零触控指引（24e 重写；2026-10-02 防循环阶梯）：14s 仍零触控 → 主文案指路 + 注入「原生锚点」逃生门。
       24d 截图教训：玩家已照指引进了 Safari，但复制的是**分享页链接**，外壳原样重现
       （分享页自己又套 iframe），触控照样 0 次。JS 事件全被外壳吃掉时唯一可能穿透的
       是**原生 <a> 导航**（浏览器本地行为，不走 JS 事件）：
       href = iframe 自己的 location（= 游戏本体直链），
       target=_top 顶掉外壳（sandbox 带 allow-top-navigation-by-user-activation，
       真实点按即满足激活条件）。
       ⚠️ 2026-10-02 玩家实测（iPhone）：点锚点顶掉外壳后**又回到加载页、按钮再次出现**，
       无限循环进不去。机理：直链顶层在 B站 App / iOS 容器语境下会**再次被套壳**
       （顶层又变 iframe → 14s 零触控 → 又注入同一个按钮）。旧代码每次注入一模一样的
       按钮 = 无循环检测，一直在喂循环。
       防循环阶梯（localStorage `whale_esc_try` 计数，15 分钟过期）：
         第 1 次 = 直链原样 + `wk_esc=1` 标记参数（envLine 显示 esc-back#1，截图实锤「跳出又被套回」）；
         第 2 次 = **去掉 query 的裸路径** + `wk_esc=2`（防 query 触发 App 拦截/重定向）；
         第 3 次起 = **不再注入跳转锚点**（停止喂循环），屏显手工逃生指引 + 裸路径文本。 */
    var ESC_KEY = "whale_esc_try";
    function escState() {
      try {
        var v = JSON.parse(localStorage.getItem(ESC_KEY) || "null");
        if (v && typeof v.n === "number" && (new Date().getTime() - v.t) < 15 * 60 * 1000) return v.n;
      } catch (e) {}

      try { localStorage.setItem(ESC_KEY, JSON.stringify({ n: n, t: new Date().getTime() })); } catch (e) {}

    function escTarget(n, stripQuery) {

    }

      if (dead() || inputs > 0) return;
      guided = true;
      mark("guide:zero-input");
      var inFrame = false;
      try { inFrame = (window.top !== window.self); } catch (e) { inFrame = true; }
      if (!inFrame) return;   // 直开页没有外壳可跳，指引到此为止（也不改主文案）
      var box = document.getElementById("load-diag");
      var t = document.getElementById("load-text");
      var n = escState();
      if (n >= 2) {
        /* 阶梯末端：自动跳出已试 2 次仍被套回 —— 停止喂循环，改手工指引 */

        if (box) {
          var tip = document.createElement("div");
          tip.style.cssText = "margin-top:8px;padding:10px 12px;background:#eef4fb;border:1px solid #b9d2ea;border-radius:10px;color:#274b66;word-break:break-all";
          tip.textContent = "请回到桌面，打开 Safari，在地址栏输入下面的地址（不带任何参数）：" +
            location.origin + location.pathname;
          box.appendChild(tip);
        }
        mark("guide:manual-only try=" + n);
        return;
      }
      if (t) t.textContent = "触控被外壳拦截 — 点下方「直接进入游戏本体」蓝色按钮";

      var a = document.createElement("a");
      a.href = escTarget(n + 1, n >= 1);  // 第 2 次起用去掉 query 的裸路径

      a.textContent = n >= 1 ? "▶ 再次尝试进入游戏本体（换裸地址 · 第 " + (n + 1) + " 次）"
                             : "▶ 直接进入游戏本体（跳过外壳）";
      a.style.cssText = "display:block;margin-top:8px;padding:11px 12px;background:#5ba9f5;color:#fff;border-radius:10px;text-align:center;text-decoration:none;font-size:14px;font-weight:bold";
      box.appendChild(a);
      mark("guide:anchor try=" + (n + 1));
    }, 14000);

    /* ③ JS 落地监视：谁出现记谁 —— 启动链断点一目了然 */
    var wanted = [
      ["FX", "fx.js"], ["AchieveStore", "achieve_store.js"], ["Menu", "menu.js"],
      ["AudioMgr", "menu.js"], ["SFX", "sfx.js"], ["GameCfg", "game_cfg.js"],
      ["V35", "v35_core.js"], ["GameSave", "game_save.js"], ["Game", "main.js"],
      ["Training", "training.js"], ["GameUI", "game_ui.js"]
    ];
    var seen = {};
    var iv = setInterval(function () {

      for (var j = 0; j < wanted.length; j++) {

        if (!seen[name] && window[name]) {

          /* menu.js 落地即清掉逃生闸那条「脚本仍在加载」的提示（自愈，2026-09-30）——
             弱网下常常下一秒就好了，不能让误导文案一直挂着 */
          if (name === "Menu" && escapeMsg) { escapeMsg = false; lastErr = ""; renderDiag(); }
        }

       ⚠️ 2026-09-30（弱网玩家实测截图）：原版「一次点按就摘监听 + 写死
       『启动超时（menu.js 未生效）』」是误导 —— menu.js 常只差一两秒，之后就正常了，
       屏上却永久挂着这条吓人文案（renderDiag 每 4s 还会再刷一遍，玩家只看到"坏了"）。
       修法：① 点按**不死锁**，未就绪时给「仍在加载」的友好提示、可反复重试；
             ② 措辞不再武断断言"未生效"；
             ③ 与下面的落地监视配合：window.Menu 一出现就**清掉**这条提示（自愈）。 */

      function off() { for (var k = 0; k < types.length; k++) window.removeEventListener(types[k], h, true); }
      var h = function () {

        if (ready()) {
          try { if (window.AudioMgr && AudioMgr.unlock) AudioMgr.unlock(); Menu.showMenu(); } catch (e) {}
          off();
          return;
        }
        /* menu.js 还没落地：不武断报错，提示"仍在加载"并可再点（下次点按会重判） */
        escapeMsg = true;
        lastErr = "网速较慢，脚本仍在加载…（点屏幕可重试）";
        renderDiag();
      };
      for (var j = 0; j < types.length; j++) window.addEventListener(types[j], h, true);
    }, 10000);
  })();
